name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      # If the build fails, publish the errors as a "build-log" release so they can be read
      # without downloading the full Actions log.
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Build failed for commit ${GITHUB_SHA::7}"; echo; echo '```';
            grep -E "error:|warning: \[|\.java:[0-9]+|FAILURE|What went wrong|> " build.log | head -150;
            echo '```'; echo; echo "Last lines:"; echo '```'; tail -60 build.log; echo '```'; } > errors.md
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log --title "Last failed build" --notes-file errors.md --prerelease --target "$GITHUB_SHA"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: PirateCrew-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Every successful build on main replaces the "latest" release with the new jar.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Pirate Crew (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download the .jar below and put it in your .minecraft/mods folder (Forge 1.20.1)." \
            --target "$GITHUB_SHA"
