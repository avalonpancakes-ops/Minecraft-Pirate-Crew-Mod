name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      # Start a real server once: it loads every dimension, generates Sundered Sea terrain and
      # spawns the mod's mobs (see debug/SmokeTest.java), catching broken data the compiler can't.
      - name: Smoke test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nspawn-protection=0\nmax-tick-time=-1\n" > run/server.properties
          timeout 1500 ./gradlew runSmokeTest --no-daemon 2>&1 | tee smoke.log || true
          grep -q "PIRATECREW SMOKETEST OK" smoke.log

      - name: Publish smoke test summary
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f smoke.log ] || exit 0
          { echo "Smoke test for ${GITHUB_SHA::7}"; echo '```';
            grep -E "PIRATECREW|\[piratecrew|piratecrew.*(WARN|ERROR)|(WARN|ERROR).*piratecrew|Exception|Caused by" smoke.log | head -150;
            echo '```'; } > smoke.md
          gh release delete smoke-log --yes --cleanup-tag || true
          gh release create smoke-log --title "Last smoke test" --notes-file smoke.md --prerelease --target "$GITHUB_SHA" $(ls run/smoke/*.png 2>/dev/null)

      # Start the client on a virtual display and screenshot the mod's screens, items, gear and
      # bosses (see client/ClientShots.java), so the art can be checked without playing.
      - name: Client screenshots
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null || true
          mkdir -p run
          printf "renderDistance:6\nguiScale:2\nonboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\n" > run/options.txt
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientShots --no-daemon 2>&1 | tee client.log || true
          { echo "Client screenshots for ${GITHUB_SHA::7}"; echo '```';
            grep -E "PIRATECREW|ERROR|Exception|Caused by|at com\.piratecrew|OpenGL|GL version" client.log | head -120;
            echo '```'; } > client.md
          gh release delete client-shots --yes --cleanup-tag || true
          gh release create client-shots --title "Client screenshots" --notes-file client.md --prerelease --target "$GITHUB_SHA" $(ls run/screenshots/*.png 2>/dev/null)

      # If the build fails, publish the errors as a "build-log" release so they can be read
      # without downloading the full Actions log.
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Build failed for commit ${GITHUB_SHA::7}"; echo; echo '```';
            grep -E "error:|warning: \[|\.java:[0-9]+|FAILURE|What went wrong|> " build.log | head -150;
            echo '```'; echo; echo "Last lines:"; echo '```'; tail -60 build.log; echo '```';
            if [ -f smoke.log ]; then echo; echo "Smoke test:"; echo '```';
              grep -E "PIRATECREW|ERROR|Exception|Caused by|at com\.piratecrew|Failed to|Couldn't" smoke.log | head -120; echo '```'; fi; } > errors.md
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log --title "Last failed build" --notes-file errors.md --prerelease --target "$GITHUB_SHA"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: PirateCrew-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Every successful build on main replaces the "latest" release with the new jar.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Pirate Crew (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download the .jar below and put it in your .minecraft/mods folder (Forge 1.20.1)." \
            --target "$GITHUB_SHA"
